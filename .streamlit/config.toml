[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#F3F4F6"
borderColor = "#1F2937"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

greenColor = "#10B981"
redColor = "#EF4444"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
blueColor = "#3B82F6"
violetColor = "#8B5CF6"
grayColor = "#6B7280"

chartCategoricalColors = [
    "#3B82F6",
    "#10B981",
    "#F59E0B",
    "#EF4444",
    "#8B5CF6",
    "#06B6D4",
    "#9CA3AF"
]

dataframeBorderColor = "#1F2937"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#070B14"
secondaryBackgroundColor = "#111827"
textColor = "#F3F4F6"
borderColor = "#1F2937"
primaryColor = "#3B82F6"
